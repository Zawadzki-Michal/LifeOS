{{- if not .Values.ollama.hostIP }}
{{- fail "values.ollama.hostIP is required — set it to the WSL2 default-route gateway IP (run `ip route show | grep default` inside the WSL2 distro). See deploy/README.md." }}
{{- end }}
# Selector-less Service + a hand-specified EndpointSlice: the standard k3s
# pattern for reaching a plain IP (no in-cluster DNS name) that isn't part of
# this cluster — here, Ollama running natively on the Windows host, reached
# via the WSL2 NAT gateway IP. See deploy/README.md for how that IP can
# change across WSL2 restarts and needs re-checking if connectivity breaks.
# (EndpointSlice, not the older Endpoints object, since Endpoints is
# deprecated as of Kubernetes v1.33.)
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels:
    {{- include "lifeos.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.ollama.port }}
      targetPort: {{ .Values.ollama.port }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ollama
  labels:
    kubernetes.io/service-name: ollama
    {{- include "lifeos.labels" . | nindent 4 }}
addressType: IPv4
ports:
  - port: {{ .Values.ollama.port }}
endpoints:
  - addresses:
      - {{ .Values.ollama.hostIP }}
