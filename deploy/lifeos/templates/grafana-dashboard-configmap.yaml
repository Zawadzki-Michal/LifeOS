# Auto-discovered by kube-prometheus-stack's Grafana sidecar (grafana-sc-dashboard,
# watches NAMESPACE=ALL for the grafana_dashboard=1 label — see
# deploy/README.md's Phase 4 section) despite living in a different namespace
# than the Grafana release itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lifeos-grafana-dashboard
  labels:
    {{- include "lifeos.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  lifeos-overview.json: |
    {{- .Files.Get "dashboards/lifeos-overview.json" | nindent 4 }}
