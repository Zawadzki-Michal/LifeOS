apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifeos-app
  labels:
    app: lifeos-app
    {{- include "lifeos.labels" . | nindent 4 }}
spec:
  # Must stay 1 replica with Recreate (not RollingUpdate): app/scheduler.py
  # runs the daily Telegram/webapp broadcast loops in-process off FastAPI's
  # lifespan — a rolling update would briefly run old+new pods together and
  # double-fire those broadcasts.
  replicas: {{ .Values.app.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lifeos-app
  template:
    metadata:
      labels:
        app: lifeos-app
    spec:
      enableServiceLinks: false # see n8n-deployment.yaml for why
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.port }}
          envFrom:
            - configMapRef:
                name: lifeos-config
            - secretRef:
                name: {{ .Values.secretName }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.app.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            # Deliberately NOT gated on /health/ollama — a host busy with a
            # game shouldn't pull the whole app out of rotation for
            # cloud-routed or non-LLM requests.
            httpGet:
              path: /health
              port: {{ .Values.app.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
